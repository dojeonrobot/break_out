<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <title>도로랜드 자료실</title>
  <!-- 도로그램(feed.html)에서 새 탭으로 여는 자료실. 문서는 archive-data.js 한 곳에 있다.
       주소: archive.html?q=검색어 (검색 결과), archive.html#doc=문서id (문서 바로 열기)
       2026-11-10 v3: 색을 빼고 문서처럼. 한 화면에 한 가지(목록 또는 문서), 본문 17px, 한 줄 68자 안팎. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="archive-data.js"></script>
  <style>
    :root {
      --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f6f8; --line: #e6e8ec; --line-2: #d4d7dd; --ink: #16181d; --ink-2: #3d434d; --muted: #6b7280;
      --accent: #1f3f8f; --accent-soft: #eef2fb; --mark: #fff3a3; --focus: #1f3f8f;
      --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --mono: ui-monospace, "SF Mono", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --surface: #111318; --surface-2: #1a1d24; --line: #262a33; --line-2: #343a46; --ink: #eceef2; --ink-2: #c7ccd6; --muted: #8b93a3; --accent: #8db0ff; --accent-soft: #1a2238; --mark: #5d5000; }
    }
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    html, body { margin: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); word-break: keep-all; -webkit-font-smoothing: antialiased; line-height: 1.7; font-size: 17px; min-height: 100dvh; }
    a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
    button { font: inherit; cursor: pointer; color: inherit; background: none; border: 0; padding: 0; }
    button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .icon { width: 18px; height: 18px; stroke-width: 2; flex-shrink: 0; }
    mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .skip { position: absolute; left: 12px; top: -60px; z-index: 20; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 8px; font-weight: 700; } .skip:focus-visible { top: 12px; }

    /* 머리 */
    .top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
    .top-in { max-width: 1040px; margin: 0 auto; padding: 12px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; }
    .brand { display: flex; align-items: baseline; gap: 10px; color: var(--ink); white-space: nowrap; } .brand:hover { text-decoration: none; }
    .brand b { font-size: 18px; font-weight: 800; letter-spacing: -.01em; } .brand small { font-size: 12.5px; color: var(--muted); }
    .search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); max-width: 560px; width: 100%; justify-self: center; }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search .icon { color: var(--muted); width: 17px; height: 17px; }
    .search input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 15.5px; color: var(--ink); outline: none; }
    .search input::-webkit-search-cancel-button { display: none; }
    .search .clear { color: var(--muted); padding: 6px; border-radius: 8px; display: none; } .search.has .clear { display: grid; }
    .search .go { background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; padding: 0 14px; height: 32px; border-radius: 7px; }
    .top-meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; text-align: right; line-height: 1.45; }
    @media (max-width: 760px) { .top-in { grid-template-columns: 1fr; gap: 10px; padding: 10px 16px; } .top-meta, .brand small { display: none; } }

    /* 본문: 한 화면에 한 가지 */
    .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 80px; }
    .page { max-width: 720px; margin: 0 auto; }
    .page.wide { max-width: 860px; }
    h1 { font-size: 28px; line-height: 1.35; font-weight: 800; letter-spacing: -.015em; margin: 0 0 8px; text-wrap: balance; }
    .lead { margin: 0; color: var(--ink-2); font-size: 16.5px; }

    /* 종류 필터: 글자 탭 */
    .types { display: flex; flex-wrap: wrap; gap: 2px 18px; margin: 26px 0 6px; border-bottom: 1px solid var(--line); }
    .types button { padding: 8px 0 10px; font-size: 14.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: baseline; }
    .types button span { font-size: 12px; color: var(--muted); } .types button:hover { color: var(--ink); }
    .types button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
    .list-h { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); margin: 18px 0 2px; } .list-h b { color: var(--ink); font-size: 15px; }

    /* 문서 목록: 줄 */
    .rows { display: grid; }
    .row { text-align: left; width: 100%; padding: 18px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; color: var(--ink); }
    .row:hover .t { color: var(--accent); }
    .row .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; } .row .meta b { color: var(--ink-2); font-weight: 600; }
    .row .t { font-weight: 700; font-size: 17.5px; line-height: 1.45; }
    .row .snip { font-size: 15px; color: var(--ink-2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .empty { padding: 48px 0; text-align: center; color: var(--muted); font-size: 15.5px; } .empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 8px; }
    .ex { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 14.5px; color: var(--muted); } .ex button { color: var(--accent); font-weight: 600; } .ex button:hover { text-decoration: underline; }

    /* 문서 */
    .back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--muted); margin-bottom: 22px; } .back:hover { color: var(--ink); } .back .icon { width: 16px; height: 16px; }
    .doc-top { font-size: 13.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; } .doc-top b { color: var(--accent); font-weight: 700; }
    .doc h1 { font-size: 30px; margin-bottom: 12px; }
    .by { font-size: 14px; color: var(--muted); margin: 0 0 26px; padding-bottom: 22px; border-bottom: 1px solid var(--line); display: flex; gap: 18px; flex-wrap: wrap; }
    .summary { margin: 0 0 26px; padding: 0 0 0 18px; border-left: 3px solid var(--ink); font-size: 18.5px; font-weight: 600; line-height: 1.65; color: var(--ink); }
    .complete { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
    .doc p { margin: 0 0 16px; font-size: 17px; line-height: 1.8; color: var(--ink); }
    .tbl { margin: 32px 0 10px; } .tbl h2 { margin: 0 0 10px; font-size: 16px; font-weight: 800; color: var(--ink); }
    .tbl-scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.55; min-width: 480px; }
    th, td { text-align: left; padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12.5px; color: var(--muted); font-weight: 700; border-bottom: 1.5px solid var(--line-2); white-space: nowrap; padding-bottom: 8px; }
    td:first-child { font-weight: 700; } td.num { font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 1px solid var(--line-2); }
    .tags { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 30px; font-size: 14px; } .tags button { color: var(--muted); } .tags button:hover { color: var(--accent); text-decoration: underline; }
    .related { margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--line); } .related h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; }
    .related ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; } .related button { text-align: left; font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.45; } .related button:hover { color: var(--accent); }
    .doc-foot { margin-top: 36px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; } .doc-foot code { font-family: var(--mono); font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media print { .top, .back, .tags, .related, .types { display: none !important; } body { font-size: 12pt; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="archive.html" id="brand"><b>도로랜드 자료실</b><small>운영실 공개 문서</small></a>
      <form class="search" id="searchForm" role="search">
        <i data-lucide="search" class="icon"></i>
        <label class="sr" for="q">자료실 검색</label>
        <input id="q" name="q" type="search" spellcheck="false" placeholder="숫자, 시간, 계정을 그대로 검색 (예: 키링 400, 막배, 사자)" autocomplete="off">
        <button type="button" class="clear" id="clearBtn" aria-label="지우기"><i data-lucide="x" class="icon"></i></button>
        <button type="submit" class="go">검색</button>
      </form>
      <div class="top-meta" id="topMeta"></div>
    </div>
  </header>

  <main class="wrap" id="main"><div id="page" class="page" aria-live="polite"></div></main>

<script>
(function () {
  const D = window.DORO_ARCHIVE, docs = D.docs, TYPES = D.types;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const ic = (n) => `<i data-lucide="${n}" class="icon"></i>`;
  const icons = () => lucide.createIcons({ attrs: { class: 'icon', 'aria-hidden': 'true' } });
  const fmtDate = d => { const [y, m, dd] = d.split('-'); return `${y}년 ${+m}월 ${+dd}일`; };
  const S = { q: '', type: 'all', doc: null };

  // ---------- 검색 ----------
  const norm = s => String(s || '').toLowerCase().replace(/[,\s]/g, '');
  const docText = d => [d.title, d.summary, (d.body || []).join(' '), (d.tables || []).map(t => [t.title, (t.cols || []).join(' '), (t.rows || []).map(r => r.join(' ')).join(' ')].join(' ')).join(' '), (d.tags || []).join(' '), d.dept].join(' ');
  const tokens = q => q.trim().split(/\s+/).filter(Boolean).map(t => t.replace(/^@/, '').toLowerCase());
  function score(d, toks) {
    const title = d.title.toLowerCase(), full = docText(d).toLowerCase(), fullN = norm(full), titleN = norm(title), tags = (d.tags || []).map(t => t.toLowerCase());
    let sc = 0;
    for (const t of toks) {
      const tn = norm(t); if (!tn) continue;
      const inTitle = title.includes(t) || titleN.includes(tn), inTags = tags.some(x => x.includes(t) || norm(x).includes(tn)), inFull = full.includes(t) || fullN.includes(tn);
      if (!inFull && !inTitle && !inTags) return 0;
      sc += inTitle ? 6 : 0; sc += inTags ? 4 : 0; sc += inFull ? 1 : 0;
    }
    return sc;
  }
  function search(q, type) {
    const toks = tokens(q);
    let list = docs.filter(d => type === 'all' || d.type === type);
    if (toks.length) list = list.map(d => ({ d, s: score(d, toks) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s || b.d.date.localeCompare(a.d.date)).map(x => x.d);
    else list = list.slice().sort((a, b) => b.date.localeCompare(a.date));
    return list;
  }
  function hl(text, toks) {
    let out = esc(text);
    toks.forEach(t => { if (!t) return; const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); out = out.replace(re, m => `<mark>${m}</mark>`);
      const tn = norm(t); if (/^\d+$/.test(tn) && tn.length >= 3) { const re2 = new RegExp(tn.split('').join('[,\\s]?'), 'g'); out = out.replace(re2, m => m.includes('<mark>') ? m : `<mark>${m}</mark>`); } });
    return out;
  }
  function snippet(d, toks) {
    if (!toks.length) return d.summary;
    const parts = [d.summary, ...(d.body || []), ...(d.tables || []).flatMap(t => (t.rows || []).map(r => r.join(' · ')))];
    for (const p of parts) { const pn = norm(p); if (toks.some(t => p.toLowerCase().includes(t) || pn.includes(norm(t)))) return p; }
    return d.summary;
  }
  const rowHTML = (d, toks) => `<button type="button" class="row" data-doc="${d.id}"><span class="meta"><b>${TYPES[d.type].label}</b><span>${fmtDate(d.date)}</span><span>${esc(d.dept)}</span>${d.complete ? '<span>전수</span>' : ''}</span><span class="t">${hl(d.title, toks)}</span><span class="snip">${hl(snippet(d, toks), toks)}</span></button>`;

  // ---------- 그리기 ----------
  function render() {
    const toks = tokens(S.q), list = search(S.q, S.type), page = $('#page');
    $('#q').value = S.q; $('#searchForm').classList.toggle('has', !!S.q);
    $('#topMeta').innerHTML = `문서 ${docs.length}건<br>${fmtDate(D.today)} 기준`;
    const d = docs.find(x => x.id === S.doc);
    page.className = 'page' + (d ? ' wide' : '');
    page.innerHTML = d ? docHTML(d, toks) : listHTML(list, toks);
    icons();
    document.title = d ? `${d.title} · 도로랜드 자료실` : S.q ? `「${S.q}」 검색 · 도로랜드 자료실` : '도로랜드 자료실';
    window.scrollTo({ top: 0 });
  }
  function listHTML(list, toks) {
    const chips = [['all', '전체']].concat(Object.entries(TYPES).map(([k, v]) => [k, v.label]));
    const counts = Object.fromEntries(chips.map(([k]) => [k, search(S.q, k).length]));
    const ex = ['키링 400', '막배', '사자', '블루웨이브', '입장권', '분실물', '100만', '야간개장', '@doroilbo'];
    const head = S.q ? `<h1>「${esc(S.q)}」 검색 결과</h1><p class="lead">${list.length}건. 글에 나온 숫자나 시간이 문서 안에서 노랗게 표시됩니다.</p>`
      : `<h1>도로랜드 자료실</h1><p class="lead">도로랜드 운영실이 공개한 기록부, 보도자료, 통계, 시설 목록입니다. 게시물에 나온 사건과 숫자가 여기 있는지, 있다면 똑같은지 확인합니다.</p><div class="ex">예시 ${ex.map(x => `<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
    return `${head}
      <div class="types" role="group" aria-label="문서 종류">${chips.map(([k, l]) => `<button type="button" data-type="${k}" aria-pressed="${S.type === k}">${l}<span>${counts[k]}</span></button>`).join('')}</div>
      <div class="list-h">${S.q ? '' : `<b>${S.type === 'all' ? '전체 문서' : TYPES[S.type].label}</b> 최근 등록 순`}</div>
      <div class="rows">${list.length ? list.map(x => rowHTML(x, toks)).join('') : `<div class="empty"><b>「${esc(S.q)}」이(가) 들어간 문서가 없습니다</b>다른 말이나 숫자로 다시 찾아보세요. 전수 문서 어디에도 없는 사건·시설·동물은 세계에 없는 것입니다.</div>`}</div>`;
  }
  function docHTML(d, toks) {
    const isNum = v => /^[\d,.\s%~+-]+(?:만|천|억|명|개|원|장|대|건|분|시간|m|km|kg|석|마리|세트|면|종)?[\s\S]{0,4}$/.test(String(v));
    const tables = (d.tables || []).map(t => `<div class="tbl">${t.title ? `<h2>${esc(t.title)}</h2>` : ''}<div class="tbl-scroll"><table><thead><tr>${t.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map((c, i) => `<td class="${i > 0 && isNum(c) ? 'num' : ''}">${hl(c, toks)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('');
    const rel = docs.filter(x => x.id !== d.id).map(x => ({ x, n: (x.tags || []).filter(t => (d.tags || []).includes(t)).length })).filter(o => o.n > 0).sort((a, b) => b.n - a.n).slice(0, 4).map(o => o.x);
    return `<article class="doc">
      <button type="button" class="back" id="backBtn">${ic('arrow-left')}${S.q ? `「${esc(S.q)}」 검색 결과로` : '문서 목록으로'}</button>
      <div class="doc-top"><b>${TYPES[d.type].label}</b><span>문서 번호 ${esc(d.id.toUpperCase())}</span>${d.complete ? '<span class="complete">전수 목록 · 여기 없으면 없는 것</span>' : ''}</div>
      <h1>${hl(d.title, toks)}</h1>
      <p class="by"><span>등록 ${fmtDate(d.date)}</span><span>${esc(D.org)} ${esc(d.dept)}</span></p>
      <p class="summary">${hl(d.summary, toks)}</p>
      ${(d.body || []).map(p => `<p>${hl(p, toks)}</p>`).join('')}
      ${tables}
      ${(d.tags || []).length ? `<div class="tags">${d.tags.map(t => `<button type="button" data-q="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : ''}
      ${rel.length ? `<div class="related"><h2>관련 문서</h2><ul>${rel.map(x => `<li><button type="button" data-doc="${x.id}">${esc(x.title)}</button></li>`).join('')}</ul></div>` : ''}
      <div class="doc-foot"><span>ⓒ ${esc(D.org)} · 이 문서의 숫자는 ${fmtDate(d.date)} 기준입니다.</span><code>archive.html#doc=${esc(d.id)}</code></div>
    </article>`;
  }

  // ---------- 주소 ----------
  function readUrl() {
    const q = new URLSearchParams(location.search).get('q') || '', m = location.hash.match(/doc=([\w-]+)/);
    S.q = q; S.doc = m && docs.some(d => d.id === m[1]) ? m[1] : null;
    if (!S.doc && q) { const first = search(q, 'all'); if (first.length === 1) S.doc = first[0].id; }
  }
  function pushUrl() {
    const u = new URL(location.href); if (S.q) u.searchParams.set('q', S.q); else u.searchParams.delete('q'); u.hash = S.doc ? 'doc=' + S.doc : '';
    history.pushState(null, '', u);
  }
  $('#searchForm').addEventListener('submit', e => { e.preventDefault(); S.q = $('#q').value.trim(); S.doc = null; render(); pushUrl(); });
  $('#q').addEventListener('input', e => { S.q = e.target.value.trim(); S.doc = null; render(); $('#q').focus(); });
  $('#clearBtn').onclick = () => { S.q = ''; S.doc = null; render(); pushUrl(); $('#q').focus(); };
  $('#brand').onclick = e => { e.preventDefault(); S.q = ''; S.type = 'all'; S.doc = null; render(); pushUrl(); };
  document.addEventListener('click', e => {
    const d = e.target.closest('[data-doc]'); if (d) { S.doc = d.dataset.doc; render(); pushUrl(); return; }
    const t = e.target.closest('[data-type]'); if (t) { S.type = t.dataset.type; render(); return; }
    const q = e.target.closest('[data-q]'); if (q) { S.q = q.dataset.q; S.doc = null; render(); pushUrl(); return; }
    if (e.target.closest('#backBtn')) { S.doc = null; render(); pushUrl(); }
  });
  window.addEventListener('popstate', () => { readUrl(); render(); });
  readUrl(); render();
  if (!S.doc && matchMedia('(pointer: fine)').matches) setTimeout(() => $('#q').focus(), 50);
})();
</script>
</body>
</html>
