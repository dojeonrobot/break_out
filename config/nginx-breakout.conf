# 챕터 입장 비밀번호 관문 (2026-10-30): /chapter0N/ 아래 전부(HTML·그림·영상·스캔)와 챕터 5 API는 쿠키 doro_chN이
# 맞아야 내려간다. 쿠키 값 = sha256("doroland-gate:N:비밀번호") 16진수. 비밀번호 자체는 이 파일에도 저장소에도 없다.
# 바꾸는 법: python3 -c "import hashlib,getpass;print(hashlib.sha256(('doroland-gate:5:'+getpass.getpass()).encode()).hexdigest())"
# 로 해시를 만들어 아래 map을 고치고 서버에서 sudo nginx -t && sudo systemctl reload nginx.
# 필요한 서버 준비물: /home/ubuntu/gateroot/ok → /home/ubuntu/breakout 심볼릭 링크 (ln -s), /etc/nginx/snippets/breakout-headers.conf.
# 속도 제한: 쿠키가 없거나 틀린 요청만 IP당 분당 20회(+10), 관리자 API는 IP당 분당 30회(+20). 넘으면 429.
# 이 파일은 서버의 certbot 줄(443·80 리다이렉트)을 뺀 것이다.
map_hash_bucket_size 128;   # 64자리 해시 키가 기본 64바이트 통에 안 들어간다
map $cookie_doro_ch1 $gate1 {
    default  bad;
    ""       none;
    "bc1780b1ec007bd9f9c2a270744b958ae33d60e712fca11f09d2fae4bdfbf0d1"  ok;
}
map $cookie_doro_ch2 $gate2 {
    default  bad;
    ""       none;
    "c4b9d67bbb50b8b5512fe85a84d611eeef6d7dc5928f1ff1b5938720f27530ca"  ok;
}
map $cookie_doro_ch3 $gate3 {
    default  bad;
    ""       none;
    "05cd2da697c393b8c527dd7d1a48f009759254505b94d4384daad66bd49d5a3f"  ok;
}
map $cookie_doro_ch4 $gate4 {
    default  bad;
    ""       none;
    "a1c063bec9828f98a2ea519bee6ef7c84fbe2217a3a3b5ade6b6f021b4feb69b"  ok;
}
map $cookie_doro_ch5 $gate5 {
    default  bad;
    ""       none;
    "b0da30f38e7e5fb35d656dd516cbf8a372aeb999ca468181720086a74d1afc86"  ok;
}
# 쿠키가 맞으면 빈 키(속도 제한에 안 셈), 아니면 IP
map $gate1 $bad1 { ok ""; default $binary_remote_addr; }
map $gate2 $bad2 { ok ""; default $binary_remote_addr; }
map $gate3 $bad3 { ok ""; default $binary_remote_addr; }
map $gate4 $bad4 { ok ""; default $binary_remote_addr; }
map $gate5 $bad5 { ok ""; default $binary_remote_addr; }
map $request_uri $adm_ip { ~^/api/(void|ch5)/admin/ $binary_remote_addr; default ""; }
limit_req_zone $bad1 zone=gate1:1m rate=20r/m;
limit_req_zone $bad2 zone=gate2:1m rate=20r/m;
limit_req_zone $bad3 zone=gate3:1m rate=20r/m;
limit_req_zone $bad4 zone=gate4:1m rate=20r/m;
limit_req_zone $bad5 zone=gate5:1m rate=20r/m;
limit_req_zone $adm_ip zone=adm:1m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name breakout.doroedu.co.kr 210.109.15.216;

    root /home/ubuntu/breakout;
    index index.html;

    # 허브·관문·허브 그림: 열려 있음. HTML은 절대 캐시 안 함 - 항상 서버에서 새로 받음
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # CSS/JS: 쿼리스트링 바뀌면 새로 받음 (허브 몫; 챕터 폴더는 아래 ^~ 블록 안에서 따로)
    location ~* \.(css|js)$ {
        try_files $uri =404;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 이미지/오디오: 쿼리스트링 바뀌면 새로 받음
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|m4a|mp4|pdf)$ {
        try_files $uri =404;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 챕터 1: 쿠키 doro_ch1이 맞을 때만 root가 실제 폴더(gateroot/ok → breakout)가 되고, 아니면 없는 폴더라 @gate1으로 떨어진다
    location ^~ /chapter01/ {
        root /home/ubuntu/gateroot/$gate1;
        limit_req zone=gate1 burst=10 nodelay;
        try_files $uri $uri/index.html @gate1;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        location ~* \.(css|js)$ {
            limit_req zone=gate1 burst=10 nodelay;
            try_files $uri @gate1;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|m4a|mp4|pdf)$ {
            limit_req zone=gate1 burst=10 nodelay;
            try_files $uri @gate1;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location @gate1 {
        if ($gate1 = ok)   { return 404; }
        if ($gate1 = none) { return 302 /gate.html?ch=1&next=$request_uri; }
        return 302 /gate.html?ch=1&bad=1&next=$request_uri;
    }
    # 챕터 2: 쿠키 doro_ch2이 맞을 때만 root가 실제 폴더(gateroot/ok → breakout)가 되고, 아니면 없는 폴더라 @gate2으로 떨어진다
    location ^~ /chapter02/ {
        root /home/ubuntu/gateroot/$gate2;
        limit_req zone=gate2 burst=10 nodelay;
        try_files $uri $uri/index.html @gate2;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        location ~* \.(css|js)$ {
            limit_req zone=gate2 burst=10 nodelay;
            try_files $uri @gate2;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|m4a|mp4|pdf)$ {
            limit_req zone=gate2 burst=10 nodelay;
            try_files $uri @gate2;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location @gate2 {
        if ($gate2 = ok)   { return 404; }
        if ($gate2 = none) { return 302 /gate.html?ch=2&next=$request_uri; }
        return 302 /gate.html?ch=2&bad=1&next=$request_uri;
    }
    # 챕터 3: 쿠키 doro_ch3이 맞을 때만 root가 실제 폴더(gateroot/ok → breakout)가 되고, 아니면 없는 폴더라 @gate3으로 떨어진다
    location ^~ /chapter03/ {
        root /home/ubuntu/gateroot/$gate3;
        limit_req zone=gate3 burst=10 nodelay;
        try_files $uri $uri/index.html @gate3;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        location ~* \.(css|js)$ {
            limit_req zone=gate3 burst=10 nodelay;
            try_files $uri @gate3;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|m4a|mp4|pdf)$ {
            limit_req zone=gate3 burst=10 nodelay;
            try_files $uri @gate3;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location @gate3 {
        if ($gate3 = ok)   { return 404; }
        if ($gate3 = none) { return 302 /gate.html?ch=3&next=$request_uri; }
        return 302 /gate.html?ch=3&bad=1&next=$request_uri;
    }
    # 챕터 4: 쿠키 doro_ch4이 맞을 때만 root가 실제 폴더(gateroot/ok → breakout)가 되고, 아니면 없는 폴더라 @gate4으로 떨어진다
    location ^~ /chapter04/ {
        root /home/ubuntu/gateroot/$gate4;
        limit_req zone=gate4 burst=10 nodelay;
        try_files $uri $uri/index.html @gate4;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        location ~* \.(css|js)$ {
            limit_req zone=gate4 burst=10 nodelay;
            try_files $uri @gate4;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|m4a|mp4|pdf)$ {
            limit_req zone=gate4 burst=10 nodelay;
            try_files $uri @gate4;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location @gate4 {
        if ($gate4 = ok)   { return 404; }
        if ($gate4 = none) { return 302 /gate.html?ch=4&next=$request_uri; }
        return 302 /gate.html?ch=4&bad=1&next=$request_uri;
    }
    # 챕터 5: 쿠키 doro_ch5이 맞을 때만 root가 실제 폴더(gateroot/ok → breakout)가 되고, 아니면 없는 폴더라 @gate5으로 떨어진다
    location ^~ /chapter05/ {
        root /home/ubuntu/gateroot/$gate5;
        limit_req zone=gate5 burst=10 nodelay;
        try_files $uri $uri/index.html @gate5;
        include snippets/breakout-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        location ~* \.(css|js)$ {
            limit_req zone=gate5 burst=10 nodelay;
            try_files $uri @gate5;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|mp3|m4a|mp4|pdf)$ {
            limit_req zone=gate5 burst=10 nodelay;
            try_files $uri @gate5;
            include snippets/breakout-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
    location @gate5 {
        if ($gate5 = ok)   { return 404; }
        if ($gate5 = none) { return 302 /gate.html?ch=5&next=$request_uri; }
        return 302 /gate.html?ch=5&bad=1&next=$request_uri;
    }

    # 챕터 5 도로그램 API (server/ch5_feed_server.py, systemd: config/dorogram.service)
    # SSE 실시간 반영을 위해 버퍼링을 끄고 연결을 길게 유지한다. 업로드 사진 때문에 본문 크기도 늘림.
    location ^~ /api/ch5/ {
        if ($gate5 != ok) { return 401 '{"ok":false,"error":"입장 비밀번호가 필요합니다. 페이지를 다시 여세요."}'; }
        default_type application/json;
        limit_req zone=adm burst=20 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        client_max_body_size 12m;
    }

    # 챕터 5 보이드의 기록 제출 API (server/ch5_void_server.py, systemd: config/voidrecord.service)
    location ^~ /api/void/ {
        if ($gate5 != ok) { return 401 '{"ok":false,"error":"입장 비밀번호가 필요합니다. 페이지를 다시 여세요."}'; }
        default_type application/json;
        limit_req zone=adm burst=20 nodelay;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 6m;
    }

    location ~ /\. {
        deny all;
    }
    location = /README.md { return 404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    gzip_min_length 1000;
}
