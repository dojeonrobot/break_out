<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>진범찾기 BREAK-OUT 활동</title>
  <link rel="stylesheet" href="styles.css">

  <!-- TensorFlow.js 및 Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>

<body>
  <!-- ① 버튼 영역 -->
  <div id="button-area">
    <img id="btnStart" src="images/reasoning.png" alt="추리 확인하기" />
    <img id="btnSerial" src="images/arduino-connect.png" alt="아두이노 연결하기" />
  </div>

  <!-- 🔧 모델 URL 입력 영역 (우측) -->
  <div id="url-area">
    <div id="url-box">
      <label for="modelUrl">🔗 모델 URL</label>
      <p id="url-desc">여러분이 만든 인공지능 모델 URL을<br>아래 빈칸에 업로드 해주세요!</p>
      <input id="modelUrl" type="text"
             value=""
             placeholder="예: https://teachablemachine.withgoogle.com/models/..." />
      <div id="url-buttons">
        <button id="btnApplyUrl" type="button">적용</button>
        <button id="btnResetUrl" type="button">초기화</button>
      </div>
      <p id="url-msg"></p>
    </div>
  </div>

  <!-- ② 메인 컨테이너 -->
  <div id="main-container">
    <div id="webcam-container"></div>
    <div id="label-container">ordinary: 0.0%<br/>warning: 0.0%</div>
    <div id="current-state">Waiting…</div>
    <div id="status">Serial: disconnected</div>
  </div>

  <!-- ③ 배경음악 요소 -->
  <audio id="bgm" src="audio/mystery.mp3" loop preload="auto"></audio>

  <script>
    // 🔧 기본 모델 URL (지금 업로드되어 있는 모델)
    const DEFAULT_URL = "https://teachablemachine.withgoogle.com/models/sRbjPP-Cq/";
    const WARNING_THRESHOLD = 0.90;

    let model, webcam, maxPredictions, port, writer, prevState = "";
    let webcamRunning = false; // 🔧 웹캠/예측 루프 실행 여부

    const audioEl       = document.getElementById("bgm");
    const btnStart      = document.getElementById("btnStart");
    const btnSerial     = document.getElementById("btnSerial");
    const modelUrlInput = document.getElementById("modelUrl");
    const btnApplyUrl   = document.getElementById("btnApplyUrl");
    const btnResetUrl   = document.getElementById("btnResetUrl");
    const urlMsg        = document.getElementById("url-msg");
    let audioPlayed = false;

    // 🔧 실제로 모델에 사용되는 "적용된" URL (입력칸은 항상 빈칸으로 시작)
    let activeUrl = DEFAULT_URL;

    const PROMPT_MSG = "✏️ URL 입력 후 '적용'을 눌러주세요";

    // 끝에 / 자동 보정 (빈 값이면 기본 URL)
    function normalizeUrl(u) {
      u = (u || "").trim();
      if (!u) return DEFAULT_URL;
      if (!u.endsWith("/")) u += "/";
      return u;
    }

    function setMsg(text, cls) {
      urlMsg.textContent = text;
      urlMsg.className = cls;
    }

    // 🔧 모델 로드 헬퍼
    async function loadModel(baseUrl) {
      model = await tmImage.load(baseUrl + "model.json", baseUrl + "metadata.json");
      maxPredictions = model.getTotalClasses();
      prevState = ""; // 모델 바뀌면 상태 초기화
    }

    // 🔧 "적용" 버튼: URL 반영 + 실행 중이면 모델 즉시 교체
    btnApplyUrl.addEventListener("click", async () => {
      const typed = modelUrlInput.value.trim();
      activeUrl = typed ? normalizeUrl(typed) : DEFAULT_URL;
      const okMsg = typed ? "✅ 입력한 모델이 적용되었습니다!" : "✅ 기본 모델이 적용되었습니다!";

      if (webcamRunning) {
        // 이미 카메라가 켜진 상태면 새 모델을 바로 불러와서 교체
        setMsg("⏳ 새 모델 적용 중…", "msg-pending");
        btnApplyUrl.disabled = true;
        try {
          await loadModel(activeUrl);
          setMsg(okMsg, "msg-ok");
        } catch (e) {
          console.error("Model load failed:", e);
          setMsg("❌ 모델 로드 실패 — URL을 확인하세요", "msg-error");
        } finally {
          btnApplyUrl.disabled = false;
        }
      } else {
        // 아직 시작 전이면 URL만 저장 (추리 확인하기 누를 때 로드됨)
        setMsg(okMsg, "msg-ok");
      }
    });

    // 🔧 "초기화" 버튼: 빈칸으로 비우고 기본 모델로 (실행 중이면 즉시 교체)
    btnResetUrl.addEventListener("click", async () => {
      modelUrlInput.value = "";
      activeUrl = DEFAULT_URL;

      if (webcamRunning) {
        setMsg("⏳ 기본 모델 적용 중…", "msg-pending");
        btnResetUrl.disabled = true;
        try {
          await loadModel(activeUrl);
          setMsg("✅ 기본 모델로 초기화되었습니다", "msg-ok");
        } catch (e) {
          console.error("Model load failed:", e);
          setMsg("❌ 모델 로드 실패", "msg-error");
        } finally {
          btnResetUrl.disabled = false;
        }
      } else {
        setMsg(PROMPT_MSG, "msg-idle");
      }
    });

    // 🔧 입력칸을 고치면 "아직 적용 안 됨" 안내
    modelUrlInput.addEventListener("input", () => {
      if (modelUrlInput.value.trim()) {
        setMsg("⚠️ 아직 적용 안 됨 — '적용'을 눌러주세요", "msg-pending");
      } else {
        setMsg(PROMPT_MSG, "msg-idle");
      }
    });

    // 초기 상태: 안내 문구만 표시 (적용 문구 아님)
    setMsg(PROMPT_MSG, "msg-idle");

    // 이미지 버튼 클릭 시 음악 재생 및 초기화
    btnStart.addEventListener("click", async () => {
      if (!audioPlayed) {
        try { await audioEl.play(); }
        catch (e) { console.warn("오토플레이 차단:", e); }
        audioPlayed = true;
      }
      init();
    });

    // 이미지 버튼 클릭 시 아두이노 연결
    btnSerial.addEventListener("click", connectSerial);

    // 모델 로드 및 웹캠 시작
    async function init() {
      if (webcamRunning) return; // 🔧 이미 시작했으면 중복 실행 방지
      btnStart.style.pointerEvents = 'none';

      // 🔧 "적용"된 URL을 사용 (입력칸이 비어 있으면 기본 모델)
      try {
        await loadModel(activeUrl);
      } catch (err) {
        console.error("Model load failed:", err);
        document.getElementById("status").textContent = "Model load failed";
        setMsg("❌ 모델 로드 실패 — URL을 확인하세요", "msg-error");
        btnStart.style.pointerEvents = 'auto'; // 🔧 실패 시 다시 누를 수 있게
        return;
      }
      webcam = new tmImage.Webcam(640, 480, true);
      await webcam.setup(); await webcam.play();
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      webcamRunning = true; // 🔧 실행 중 표시 (이후 '적용'은 즉시 모델 교체)
      window.requestAnimationFrame(loop);
    }

    // 예측 루프
    async function loop() {
      webcam.update();
      preprocessCanvas(webcam.canvas); // 🔥 전처리 호출
      await predict();
      window.requestAnimationFrame(loop);
    }

   // 🎨 전처리 함수 (밝기/대비 조정)
    function preprocessCanvas(canvas, brightness = 5, contrast = 25) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));

      for (let i = 0; i < data.length; i += 4) {
        data[i]   = factor * (data[i] - 128) + 128 + brightness;   // R
        data[i+1] = factor * (data[i+1] - 128) + 128 + brightness; // G
        data[i+2] = factor * (data[i+2] - 128) + 128 + brightness; // B
      }
      ctx.putImageData(imgData, 0, 0);
    }
    
    // 시리얼 연결
  async function connectSerial() {
    try {
      const portRequested = await navigator.serial.requestPort();
      await portRequested.open({ baudRate: 9600 });
      writer = portRequested.writable.getWriter();
      console.log("✅ Serial connected, writer ready");
      document.getElementById("status").textContent = "Serial: connected";
    } catch (err) {
      console.error("⚠️ Serial connection failed:", err);
      document.getElementById("status").textContent = "Serial: failed";
    }
  }

  // 예측 및 상태 갱신
  async function predict() {
    const prediction = await model.predict(webcam.canvas);
    const ord  = prediction.find(p => p.className === "ordinary")?.probability || 0;
    const warn = prediction.find(p => p.className === "warning")?.probability  || 0;

    // 레이블 업데이트
    document.getElementById("label-container").innerHTML =
      `ordinary: ${(ord*100).toFixed(1)}%<br>` +
      `warning: ${(warn*100).toFixed(1)}%`;

    // 상태 결정
    const state = warn >= WARNING_THRESHOLD ? "warning" : "ordinary";
    const stateEl = document.getElementById("current-state");
    stateEl.textContent = state;
    stateEl.style.color = (state === "warning" ? "red" : "green");

    // **보낼 값 로깅 & 전송**
    if (state !== prevState && writer) {
      console.log(`→ [JS] Sending to Arduino: "${state}\\n"`);
      try {
        await writer.write(new TextEncoder().encode(state + "\n"));
      } catch (e) {
        console.error("⚠️ Error writing to serial:", e);
      }
      prevState = state;
    }
  }
  </script>
</body>
</html>
