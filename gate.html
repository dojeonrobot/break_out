<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>입장 비밀번호 · DOROLAND Break Out</title>
<!--
  챕터 입장 관문. nginx가 /chapter0N/ 요청에 쿠키 doro_chN이 없거나 틀리면 이 페이지로 보낸다
  (config/nginx-breakout.conf). 비밀번호 자체는 이 파일에 없다: 입력값을 해시해 쿠키에 넣고 원래 주소로 돌아가면
  nginx가 맞는지 본다. 틀리면 ?bad=1 로 다시 온다. 비밀번호를 바꾸려면 nginx의 map 값(해시)을 바꾼다.
-->
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1e293b;--mute:#64748b;--line:#e2e8f0;--acc:#059669;--bad:#e11d48}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px;word-break:keep-all;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px 28px 28px;box-shadow:0 24px 60px -32px rgba(30,41,59,.25)}
small.k{display:block;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:700}
h1{font-size:24px;line-height:1.3;margin:6px 0 10px;font-weight:800}
p.d{margin:0 0 22px;color:var(--mute);font-size:15px;line-height:1.6}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:8px}
input{width:100%;height:56px;border:1.5px solid var(--line);border-radius:14px;background:#f8fafc;font:inherit;font-size:24px;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
main.bad input{border-color:var(--bad);box-shadow:0 0 0 3px rgba(225,29,72,.14)}
p.e{display:none;margin:10px 0 0;color:var(--bad);font-size:14px;font-weight:600;line-height:1.5}
main.bad p.e{display:block}
button{width:100%;height:54px;margin-top:18px;border:0;border-radius:14px;background:#1e293b;color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:#0f172a}
button:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:default}
p.h{margin:18px 0 0;font-size:13px;color:var(--mute);line-height:1.6}
p.h a{color:var(--mute)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
main.shake input{animation:shake .35s}
@media (prefers-reduced-motion:reduce){main.shake input{animation:none}}
</style>
</head>
<body>
<main>
  <small class="k">DOROLAND · BREAK OUT</small>
  <h1 id="t">챕터 입장</h1>
  <p class="d">담당 선생님께 받은 입장 비밀번호를 입력하세요.<br>한 번 입력하면 이 기기에서는 다시 묻지 않습니다.</p>
  <form id="f" autocomplete="off">
    <label for="pw">입장 비밀번호</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="32" aria-describedby="e">
    <p class="e" id="e">비밀번호가 맞지 않습니다. 다시 입력하세요.</p>
    <button type="submit" id="go">입장하기</button>
  </form>
  <p class="h"><a href="/">챕터 목록으로</a></p>
</main>
<script>
(function(){
  const NAMES = {1:'Chapter 01 : 사파리 구역', 2:'Chapter 02 : 하모니아 구역', 3:'Chapter 03 : 회전목마 구역', 4:'Chapter 04 : 중앙관리실 구역', 5:'Chapter 05 : 코덱스의 선택'};
  const q = location.search.slice(1);
  const get = k => { const m = q.match(new RegExp('(?:^|&)' + k + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : ''; };
  // next는 맨 뒤에 오고 안에 &가 있을 수 있어 통째로 자른다
  const ni = q.indexOf('next='); let next = ni >= 0 ? q.slice(ni + 5) : '';
  try{ next = decodeURIComponent(next); }catch(e){}
  const ch = parseInt(get('ch'), 10);
  if(!(ch >= 1 && ch <= 5) || !/^\/chapter0[1-5]\//.test(next)){ location.replace('/'); return; }
  if(/^\/\//.test(next) || /[\r\n]/.test(next)) next = '/chapter0' + ch + '/index.html';
  const main = document.querySelector('main'), pw = document.getElementById('pw'), go = document.getElementById('go');
  document.getElementById('t').textContent = NAMES[ch];
  document.title = NAMES[ch] + ' 입장 · DOROLAND Break Out';
  if(get('bad') === '1'){ main.classList.add('bad'); document.cookie = 'doro_ch' + ch + '=; Path=/; Max-Age=0'; }
  async function token(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=> x.toString(16).padStart(2, '0')).join(''); }
  document.getElementById('f').addEventListener('submit', async e=>{
    e.preventDefault();
    const v = pw.value.trim();
    if(!v){ main.classList.remove('shake'); void main.offsetWidth; main.classList.add('shake'); pw.focus(); return; }
    if(!(crypto && crypto.subtle)){ alert('https 주소로 접속해 주세요.'); return; }
    go.disabled = true; go.textContent = '확인 중…';
    const t = await token('doroland-gate:' + ch + ':' + v);
    const secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = 'doro_ch' + ch + '=' + t + '; Path=/; Max-Age=15552000; SameSite=Lax' + secure;   // 180일
    location.replace(next);
  });
  setTimeout(()=> pw.focus(), 80);
})();
</script>
</body>
</html>
